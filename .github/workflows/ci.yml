name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      # Match the release target so CI and the signed build share compiled artifacts.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      # Keep the CI and release jobs on one reusable Windows Cargo cache. The
      # lockfile/toolchain hash still invalidates it when dependencies change.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: atelier-windows-stable
          add-job-id-key: "false"
          cache-targets: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          save-if: ${{ github.event_name == 'push' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy-strict
      - run: cargo test --workspace
      - run: cargo xtask line-budget
      - run: cargo xtask resource catalog
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
