name: Release resources

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA on main containing the complete catalog (blank uses the workflow's main revision)."
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: release-resources
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: automation/.node-version
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.commit }}
        run: node automation/scripts/release/resources.mjs prepare resource-plan.json
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.source_sha }}
          path: source
          lfs: false
          persist-credentials: false
      - name: Stage the complete catalog and selectively fetch owned payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/scripts/release/resources.mjs pack source resource-plan.json artifact
      - uses: actions/upload-artifact@v4
        with:
          name: resource-release
          path: artifact/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: resource-release
          path: artifact
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/resources.mjs publish artifact
