[package]
name = "nai-atelier-desktop"
version = "0.1.0"
description = "NAI Atelier desktop shell"
authors = []
edition = "2021"
rust-version = "1.77.2"
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nai_atelier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
log = "0.4"
nai-atelier-adapter-desktop-system = { path = "../../../crates/adapters/desktop-system" }
nai-atelier-adapter-keyring = { path = "../../../crates/adapters/keyring" }
nai-atelier-adapter-novelai = { path = "../../../crates/adapters/novelai" }
nai-atelier-adapter-safety-onnx = { path = "../../../crates/adapters/safety-onnx" }
nai-atelier-app = { path = "../../../crates/app" }
nai-atelier-app-api = { path = "../../../crates/app-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
