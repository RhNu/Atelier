[package]
name = "nai-atelier-desktop"
version = "0.1.0"
description = "NAI Atelier desktop shell"
authors = []
edition = "2021"
rust-version = "1.77.2"
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nai_atelier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = { workspace = true }
log = "0.4"
nai-atelier-adapter-keyring = { workspace = true }
nai-atelier-adapter-novelai = { workspace = true }
nai-atelier-adapter-safety-onnx = { workspace = true }
nai-atelier-app = { workspace = true }
nai-atelier-app-api = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
