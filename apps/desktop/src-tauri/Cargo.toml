[package]
name = "atelier-desktop"
version = "0.1.0"
description = "Atelier desktop shell"
authors = []
edition = "2024"
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "atelier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = { workspace = true }
image = { workspace = true, features = ["png"] }
arboard = "3.6"
log = "0.4"
atelier-adapter-keyring = { workspace = true }
atelier-adapter-danbooru = { workspace = true }
atelier-adapter-image-codec = { workspace = true }
atelier-adapter-downloadable-resources-fs = { workspace = true }
atelier-adapter-novelai = { workspace = true }
atelier-adapter-lexicon-bundle = { workspace = true }
atelier-adapter-onnx-runtime = { workspace = true }
atelier-adapter-image-analysis-onnx = { workspace = true }
atelier-adapter-settings-fs = { workspace = true }
atelier-adapter-secrets-fs = { workspace = true }
atelier-app = { workspace = true }
atelier-app-api = { workspace = true }
atelier-image-analysis = { workspace = true }
atelier-downloadable-resources = { workspace = true }
atelier-prompt-lexicon = { workspace = true }
atelier-safety = { workspace = true }
atelier-settings = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
thiserror = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
