[package]
name = "atelier-adapter-image-analysis-onnx"
version = "0.1.0"
edition = "2024"
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
atelier-adapter-onnx-runtime = { workspace = true }
atelier-image-analysis = { workspace = true }
atelier-resource-catalog = { workspace = true }
csv = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
ort = { workspace = true, features = ["std", "load-dynamic", "api-22"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
atelier-safety = { workspace = true }
futures-executor = { workspace = true }
tempfile = { workspace = true }
