[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/app",
    "crates/app-api",
    "crates/adapters/keyring",
    "crates/adapters/secrets-fs",
    "crates/adapters/novelai",
    "crates/adapters/image-analysis-onnx",
    "crates/adapters/image-codec",
    "crates/adapters/downloadable-resources-fs",
    "crates/adapters/database",
    "crates/adapters/danbooru",
    "crates/adapters/storage-fs",
    "crates/adapters/onnx-runtime",
    "crates/adapters/lexicon-bundle",
    "crates/adapters/settings-fs",
    "crates/foundation",
    "crates/kernel",
    "crates/features/director",
    "crates/features/downloadable-resources",
    "crates/features/danbooru",
    "crates/features/artifacts",
    "crates/features/generation",
    "crates/features/gallery",
    "crates/features/image-analysis",
    "crates/features/jobs",
    "crates/features/prompt",
    "crates/features/prompt-resources",
    "crates/features/prompt-lexicon",
    "crates/features/precise-reference",
    "crates/features/resource-catalog",
    "crates/features/safety",
    "crates/features/secrets",
    "crates/features/settings",
    "crates/features/vibe",
    "crates/features/workspace",
    "xtask",
]
resolver = "3"

[workspace.package]
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytecount = "0.6"
clap = "4"
csv = "1"
futures = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
futures-timer = "3"
futures-util = "0.3"
image = { version = "0.25.10", default-features = false }
keyring = "4.0.1"
keyring-core = "1.0.0"
log = "0.4"
logos = "0.16"
half = "2"
memmap2 = "0.9"
rayon = "1"
semver = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
atelier-adapter-database = { path = "crates/adapters/database" }
atelier-adapter-danbooru = { path = "crates/adapters/danbooru" }
atelier-adapter-downloadable-resources-fs = { path = "crates/adapters/downloadable-resources-fs" }
atelier-adapter-image-analysis-onnx = { path = "crates/adapters/image-analysis-onnx" }
atelier-adapter-image-codec = { path = "crates/adapters/image-codec" }
atelier-adapter-keyring = { path = "crates/adapters/keyring" }
atelier-adapter-secrets-fs = { path = "crates/adapters/secrets-fs" }
atelier-adapter-novelai = { path = "crates/adapters/novelai" }
atelier-adapter-onnx-runtime = { path = "crates/adapters/onnx-runtime" }
atelier-adapter-lexicon-bundle = { path = "crates/adapters/lexicon-bundle" }
atelier-adapter-settings-fs = { path = "crates/adapters/settings-fs" }
atelier-adapter-storage-fs = { path = "crates/adapters/storage-fs" }
atelier-app = { path = "crates/app" }
atelier-app-api = { path = "crates/app-api" }
atelier-artifacts = { path = "crates/features/artifacts" }
atelier-director = { path = "crates/features/director" }
atelier-danbooru = { path = "crates/features/danbooru" }
atelier-downloadable-resources = { path = "crates/features/downloadable-resources" }
atelier-foundation = { path = "crates/foundation" }
atelier-gallery = { path = "crates/features/gallery" }
atelier-image-analysis = { path = "crates/features/image-analysis" }
atelier-generation = { path = "crates/features/generation" }
atelier-jobs = { path = "crates/features/jobs" }
atelier-kernel = { path = "crates/kernel" }
atelier-precise-reference = { path = "crates/features/precise-reference" }
atelier-prompt = { path = "crates/features/prompt" }
atelier-prompt-lexicon = { path = "crates/features/prompt-lexicon" }
atelier-prompt-resources = { path = "crates/features/prompt-resources" }
atelier-resource-catalog = { path = "crates/features/resource-catalog" }
atelier-safety = { path = "crates/features/safety" }
atelier-secrets = { path = "crates/features/secrets" }
atelier-settings = { path = "crates/features/settings" }
atelier-vibe = { path = "crates/features/vibe" }
atelier-workspace = { path = "crates/features/workspace" }
novelai-bridge = "0.4.0"
ort = { version = "2.0.0-rc.12", default-features = false }
reqwest = { version = "0.13.4", features = ["stream"] }
rowan = "0.16"
rusqlite = "0.39.0"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "format"] }
unicode-normalization = "0.1"
url = "2"
walkdir = "2"
zstd = "0.13"
